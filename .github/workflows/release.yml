# Release Workflow - Automated versioning and publishing
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      # Set only when this run published (or confirmed) the version on npm —
      # the docs-artifact job below keys off it.
      docs_tag: ${{ steps.docs.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release PR or Publish
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Read package version
        id: pkg
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check which registries need this version
        id: check
        if: ${{ steps.pkg.outputs.version }}
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          npm_status=$(curl -sS -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@fanvue/ui/$VERSION")
          case "$npm_status" in
            200) need_npm=false ;;
            404) need_npm=true ;;
            *)   echo "::error::Unexpected npmjs.org status for $VERSION: $npm_status"; exit 1 ;;
          esac

          # GH Packages has no documented per-version GET; use the org REST API.
          gh_body=$(mktemp)
          gh_status=$(curl -sS -o "$gh_body" -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/fanvue/packages/npm/ui/versions?per_page=100")
          case "$gh_status" in
            200)
              if jq -e --arg v "$VERSION" 'any(.name == $v)' "$gh_body" > /dev/null; then
                need_gh=false
              else
                need_gh=true
              fi
              ;;
            404) need_gh=true ;;
            *)   echo "::error::Unexpected GitHub Packages status: $gh_status"; cat "$gh_body"; exit 1 ;;
          esac

          echo "npmjs.org $VERSION -> HTTP $npm_status (need_npm=$need_npm)"
          echo "GitHub Packages $VERSION -> HTTP $gh_status (need_gh=$need_gh)"
          {
            echo "need_npm=$need_npm"
            echo "need_gh=$need_gh"
            if [[ "$need_npm" == "true" || "$need_gh" == "true" ]]; then
              echo "should_build=true"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: ${{ steps.check.outputs.should_build == 'true' }}
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: ${{ steps.check.outputs.should_build == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: ${{ steps.check.outputs.should_build == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build library
        id: build
        if: ${{ steps.check.outputs.should_build == 'true' }}
        run: pnpm build

      - name: Publish to npm
        id: publish_npm
        if: ${{ steps.check.outputs.need_npm == 'true' }}
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          flags=(--access public --provenance)
          if [[ "$VERSION" == *"-"* ]]; then
            flags+=(--tag alpha)
            echo "Publishing prerelease $VERSION with tag alpha"
          else
            echo "Publishing stable $VERSION"
          fi
          # Retry to recover from transient Sigstore/Rekor errors (e.g. TLOG_CREATE_ENTRY_ERROR).
          # Each attempt requests a fresh Fulcio cert so retries do not collide on the Rekor log.
          for attempt in 1 2 3; do
            if npm publish "${flags[@]}"; then exit 0; fi
            echo "::warning::npm publish attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          exit 1

      - name: Setup Node.js for GitHub Packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.check.outputs.need_gh == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish to GitHub Packages
        id: publish_gh
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.check.outputs.need_gh == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          # Override project .npmrc scoped registry to target GitHub Packages
          npm config set @fanvue:registry https://npm.pkg.github.com --location=project
          if [[ "$VERSION" == *"-"* ]]; then
            echo "Publishing prerelease $VERSION to GitHub Packages with tag alpha"
            npm publish --registry https://npm.pkg.github.com --tag alpha
          else
            echo "Publishing stable $VERSION to GitHub Packages"
            npm publish --registry https://npm.pkg.github.com
          fi

      - name: Notify Slack
        if: ${{ !cancelled() && (steps.publish_npm.outcome == 'success' || steps.publish_gh.outcome == 'success') }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ steps.pkg.outputs.version }}
          TAG_NAME: ${{ steps.release.outputs.tag_name || format('ui-v{0}', steps.pkg.outputs.version) }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO: ${{ github.repository }}
          NPM_RESULT: ${{ steps.publish_npm.outcome }}
          GH_RESULT: ${{ steps.publish_gh.outcome }}
          IS_RECOVERY: ${{ steps.release.outputs.release_created != 'true' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Recovery runs don't have release-please outputs; fall back to the GitHub Release body.
          if [ -z "$RELEASE_BODY" ]; then
            RELEASE_BODY=$(gh release view "$TAG_NAME" --repo "$REPO" --json body --jq .body 2>/dev/null || echo "Republished ${VERSION}")
          fi

          if [ "$IS_RECOVERY" = "true" ]; then
            HEADER_TEXT="@fanvue/ui v${VERSION} republished"
          else
            HEADER_TEXT="@fanvue/ui v${VERSION} released"
          fi

          case "${NPM_RESULT}_${GH_RESULT}" in
            success_success) PUBLISHED_TO="npm, GitHub Packages" ;;
            success_*)       PUBLISHED_TO="npm" ;;
            *_success)       PUBLISHED_TO="GitHub Packages" ;;
          esac

          # Convert GitHub markdown to Slack mrkdwn, truncate, and JSON-encode for the payload
          RELEASE_BODY=$(RELEASE_BODY="$RELEASE_BODY" node scripts/gfm-to-slack-mrkdwn.mjs)
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --fail-with-body \
            -d @- <<PAYLOAD
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "${HEADER_TEXT}",
                  "emoji": true
                }
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Published to: ${PUBLISHED_TO}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ${RELEASE_BODY}
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Release"
                    },
                    "url": "${REPO_URL}/releases/tag/${TAG_NAME}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View on npm"
                    },
                    "url": "https://www.npmjs.com/package/@fanvue/ui/v/${VERSION}"
                  }
                ]
              }
            ]
          }
          PAYLOAD

      - name: Expose the tag for the docs artifact job
        # Gated on npm specifically, not on "either registry": the docs tell
        # readers to `pnpm add @fanvue/ui`, so a GitHub-Packages-only publish
        # must not advertise a version npm cannot install. need_npm == 'false'
        # covers the recovery path where the version is already on npm.
        id: docs
        if: ${{ !cancelled() && (steps.publish_npm.outcome == 'success' || steps.check.outputs.need_npm == 'false') }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name || format('ui-v{0}', steps.pkg.outputs.version) }}
        run: echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

  # Generates docs/mintlify/ for the released tag and attaches it to the GitHub
  # release as docs-mintlify.tar.gz. The generated half of that tree
  # (components/, snippets/, nav.json) is gitignored, so this asset is the only
  # complete docs tree a release has — fanvue/styx-docs-mintlify's sync job
  # downloads it. A separate job so a docs failure can never block or fail the
  # npm publish, and so it can check out the tag itself rather than whatever
  # main has moved on to.
  docs-artifact:
    name: Docs artifact
    needs: release
    if: ${{ needs.release.outputs.docs_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.docs_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate docs
        run: pnpm docs:generate

      # Same shape as a repo tarball — one top-level directory with
      # docs/mintlify/ inside — which is what the docs repo's sync script
      # extracts. --clobber so re-running this job repairs a broken asset.
      - name: Attach docs to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release.outputs.docs_tag }}
        run: |
          staging=$(mktemp -d)
          mkdir -p "$staging/fanv-ui-docs/docs"
          cp -R docs/mintlify "$staging/fanv-ui-docs/docs/"
          tar -czf docs-mintlify.tar.gz -C "$staging" fanv-ui-docs
          gh release upload "$TAG_NAME" docs-mintlify.tar.gz --clobber

      - name: Notify docs site
        # After the asset upload on purpose: the dispatch tells the docs repo
        # to download that asset, so firing earlier would race it.
        # The docs site also runs a daily scheduled sync, so a dispatch hiccup
        # must never turn this job red as if the artifact were missing.
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.UI_DOCS_DISPATCH_TOKEN }}
          TAG_NAME: ${{ needs.release.outputs.docs_tag }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::UI_DOCS_DISPATCH_TOKEN is not set — skipping docs site dispatch"
            exit 0
          fi

          body=$(mktemp)
          status=$(curl -sS -o "$body" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/fanvue/styx-docs-mintlify/dispatches" \
            -d "{\"event_type\":\"ui-docs-release\",\"client_payload\":{\"tag\":\"${TAG_NAME}\"}}")

          if [ "$status" = "204" ]; then
            echo "Dispatched ui-docs-release for $TAG_NAME to fanvue/styx-docs-mintlify"
            exit 0
          fi

          echo "::error::docs site dispatch failed with HTTP $status"
          cat "$body"
          exit 1
